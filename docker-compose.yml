version: "3.9"

services:

  mongodb:
    image: mongo:7
    container_name: nexusops-mongodb

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend

    container_name: nexusops-backend

    restart: always

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    depends_on:
      - mongodb

  frontend:
    build: ./frontend

    container_name: nexusops-frontend

    restart: always

    ports:
      - "5173:5173"

    depends_on:
      - backend

  prometheus:
    image: prom/prometheus

    container_name: nexusops-prometheus

    restart: always

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - backend

volumes:

  mongodb_data: